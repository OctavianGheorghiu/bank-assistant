name: bank-assistant

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      # Read by the init script to create one login role per service
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?set it in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18, so mount the parent
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  accounts-service:
    build:
      context: .
      args:
        MODULE: accounts-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bank
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?set it in .env}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    environment:
      ACCOUNTS_SERVICE_URL: http://accounts-service:8081
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      accounts-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 512m

volumes:
  pgdata:
