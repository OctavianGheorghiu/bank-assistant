server:
  port: 8081

spring:
  application:
    name: accounts-service
  datasource:
    # Compose overrides the host with SPRING_DATASOURCE_URL
    url: jdbc:postgresql://localhost:5432/bank
    username: accounts
    password: ${ACCOUNTS_DB_PASSWORD:}
  flyway:
    schemas: accounts
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it at startup
      ddl-auto: validate
    properties:
      hibernate.default_schema: accounts

logging:
  level:
    # Debug shows the service-layer entry logs as well as the controller ones
    com.bankassistant: debug
  pattern:
    # Line breaks in a message become spaces, so a value from a request cannot start a fake log line
    console: "%d{ISO8601} %5p [%15.15t] %-40.40logger{39} : %replace(%m){'[\\r\\n]+', ' '}%n"

management:
  endpoints:
    web:
      exposure:
        include: health
