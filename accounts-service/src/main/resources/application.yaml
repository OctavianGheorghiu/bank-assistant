server:
  port: 8081

spring:
  application:
    name: accounts-service
  datasource:
    # Compose overrides the host with SPRING_DATASOURCE_URL
    url: jdbc:postgresql://localhost:5432/bank
    username: accounts
    password: ${ACCOUNTS_DB_PASSWORD:}
    hikari:
      schema: accounts
  flyway:
    schemas: accounts
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities match it at startup
      ddl-auto: validate
    properties:
      hibernate.default_schema: accounts

logging:
  level:
    # Debug shows the service-layer entry logs as well as the controller ones
    com.bankassistant: debug

management:
  endpoints:
    web:
      exposure:
        include: health
