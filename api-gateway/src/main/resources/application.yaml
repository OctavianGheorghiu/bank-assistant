server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # With both set, keys come from jwk-set-uri and the iss claim must equal issuer-uri (no discovery call)
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/bank}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/bank/protocol/openid-connect/certs}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # /api/accounts/** from outside -> /accounts/** on accounts-service
            - id: accounts
              uri: ${ACCOUNTS_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/accounts/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health
